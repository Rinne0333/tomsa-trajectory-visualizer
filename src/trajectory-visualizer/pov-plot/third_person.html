<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visão Local</title>
    <link rel="stylesheet" href="/pov-assets/third_person.css">
    <script type="importmap">
      {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
    </script>
  </head>
  <body>
    <main class="viewer" aria-label="Three-dimensional robot replay">
      <header class="toolbar">
        <label class="field" for="robot-select">
          <span>Veiculo</span>
          <select id="robot-select" disabled></select>
        </label>
        <div class="telemetry" aria-live="polite">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Carregar Trajetória</span>
        </div>
      </header>

      <section class="viewport" aria-label="3D trajectory scene">
        <canvas id="scene"></canvas>
        <div class="scene-label">
          <span class="scene-kicker">Simulação em Direto</span>
          <span id="scene-robot">Robot 1</span>
        </div>
        <div class="axis-note" aria-hidden="true">Norte <i></i> Altitude  </div>
        <aside class="overlay-drawer" id="overlay-drawer">
          <button
            class="drawer-toggle"
            id="drawer-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="overlay-content"
            aria-label="Open overlay panel"
          >
            <span class="drawer-icon" aria-hidden="true"></span>
            <span class="drawer-toggle-label">OVERLAYS</span>
          </button>
          <div class="overlay-sidebar" id="overlay-content" aria-label="Scene overlays" inert>
            <span class="sidebar-heading">OVERLAYS</span>
            <label class="overlay-toggle" for="axis-toggle">
              <input id="axis-toggle" type="checkbox" checked>
              <span>Robot axes</span>
            </label>
            <label class="overlay-toggle" for="heading-toggle">
              <input id="heading-toggle" type="checkbox" checked>
              <span>Heading vector</span>
            </label>
            <section class="depth-panel" id="depth-panel" aria-labelledby="depth-title">
              <div class="depth-reading">
                <span id="depth-title">RELATIVE DEPTH</span>
                <output id="depth-value">0.0 m</output>
              </div>
              <div
                class="depth-gauge"
                id="depth-gauge"
                role="meter"
                aria-label="Relative depth from the first sample"
                aria-valuemin="0"
                aria-valuemax="0"
                aria-valuenow="0"
                aria-valuetext="0.0 meters"
              >
                <div class="depth-scale">
                  <span class="depth-scale-label depth-scale-minimum" id="depth-min-label">-0.5</span>
                  <span class="depth-scale-label depth-scale-maximum" id="depth-max-label">0.5</span>
                  <div class="depth-track">
                    <div class="depth-zero-line" id="depth-zero-line"></div>
                    <div class="depth-fill" id="depth-fill"></div>
                    <div class="depth-marker" id="depth-marker"></div>
                  </div>
                </div>
              </div>
              <span class="depth-caption">positive down · from first sample</span>
            </section>
            <section class="nearby-panel" aria-labelledby="nearby-title">
              <div class="nearby-heading">
                <span class="sidebar-heading" id="nearby-title">ROVERS WITHIN 1 KM</span>
                <span id="nearby-count">0</span>
              </div>
              <div class="nearby-stats" id="nearby-stats" aria-live="polite">
                <span>Nearest <b id="nearby-nearest">—</b></span>
                <span>Average <b id="nearby-average">—</b></span>
              </div>
              <ul class="nearby-list" id="nearby-list" aria-label="Nearby active rovers"></ul>
            </section>
          </div>
        </aside>
        <div class="loading" id="loading">Loading AUV model...</div>
      </section>

      <section class="transport" aria-label="Playback controls">
        <div class="transport-row">
          <button id="play-button" class="play-button" type="button" disabled aria-label="Play">
            <span class="play-icon" aria-hidden="true"></span>
          </button>
          <div class="timeline">
            <div class="timeline-labels">
              <span id="current-time">0.0 s</span>
              <span id="duration">0.0 s</span>
            </div>
            <input id="time-slider" type="range" min="0" max="0" step="0.01" value="0" disabled aria-label="Replay time">
          </div>
          <label class="field speed-field" for="speed-select">
            <span>SPEED</span>
            <select id="speed-select" aria-label="Playback speed">
              <option value="1">1x</option>
              <option value="2">2x</option>
              <option value="4" selected>4x</option>
              <option value="8">8x</option>
              <option value="16">16x</option>
            </select>
          </label>
        </div>
      </section>
    </main>
    <script type="module" src="/pov-assets/third_person.js"></script>
  </body>
</html>
